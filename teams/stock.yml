# The stock team. Every fight runs this first, on your machine, so your team has a
# baseline to beat. Deliberately simple: one cleaner, one checker.
name: stock
stages:
  - name: clean
    type: map
    model: qwen2.5:3b
    batch: 10
    prompt: ../prompts/clean.md
  - name: check
    type: verify
    model: qwen2.5:3b
    batch: 10
    prompt: ../prompts/check.md
