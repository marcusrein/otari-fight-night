# Otari gateway config. You should not need to edit this: fighters are picked in .env.
master_key: ${OTARI_MASTER_KEY}

# Local models cost nothing; without this Otari refuses unpriced traffic with a 402.
require_pricing: false

# Ollama runs on your machine, not in Docker, so the GPU is used. The referee
# switches the two fighter models on under this provider before round one.
hosted_providers:
  ollama:
    api_base: http://host.docker.internal:11434

# One alias per corner. The referee asks for "fighter-a" and "fighter-b" and
# never needs to know which model is behind them.
aliases:
  fighter-a: "ollama:${FIGHTER_A}"
  fighter-b: "ollama:${FIGHTER_B}"

# One scoped key per corner, so the dashboard and usage API attribute every
# request to the right fighter.
api_keys:
  fighter-a:
    secret: ${FIGHTER_A_KEY}
    user_id: fighter-a
  fighter-b:
    secret: ${FIGHTER_B_KEY}
    user_id: fighter-b
